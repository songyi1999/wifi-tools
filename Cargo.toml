[package]
name = "wifi-toolkit"
version = "0.1.0"
edition = "2021"
description = "WiFi toolkit: scan / WPS probe / capture / crack with auto-restore, GUI + CLI"

[dependencies]
eframe = "0.31"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"

[profile.release]
opt-level = 2
lto = false
