[package]
name = "wifi-toolkit"
version = "0.1.0"
edition = "2021"
description = "WiFi toolkit: scan / WPS probe / capture / crack with auto-restore, GUI + CLI"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
wry = "0.57.1"
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }
tao = "0.37"
tracing-appender = "0.2"

[profile.release]
opt-level = 2
lto = false
